<!doctype html>
<html lang="en" ng-app="fieldstone">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Fieldstone HR</title>
  <link rel="stylesheet" href="styles.css">
  <script src="angular.min.js"></script>
</head>
<body ng-controller="RegisterCtrl">
  <header class="topbar">
    <span class="brand">Fieldstone HR</span>
    <nav aria-label="Main">
      <a href="index.html" id="nav-home">Home</a>
      <a href="register.html" id="nav-register">Register</a>
      <a href="profile.html" id="nav-profile">Profile</a>
      <a href="directory.html" id="nav-directory">Directory</a>
    </nav>
  </header>
  <main>
    <h1 id="register-title">Register an employee</h1>

    <form name="regForm" novalidate>
      <label for="reg-name">Full name</label>
      <input type="text" id="reg-name" ng-model="emp.name" placeholder="Grace Hopper">

      <label for="reg-email">Work email</label>
      <input type="email" id="reg-email" ng-model="emp.email" placeholder="grace@fieldstone.test">

      <label for="reg-role">Role</label>
      <select id="reg-role" ng-model="emp.role">
        <option>Engineer</option>
        <option>Designer</option>
        <option>Manager</option>
      </select>

      <label class="check-row" for="reg-terms">
        <input type="checkbox" id="reg-terms" ng-model="emp.terms"> I confirm this person agreed to the handbook
      </label>

      <button class="btn" id="reg-submit" type="button" ng-click="submit()">Create account</button>

      <p class="status err" id="reg-error" role="alert" ng-if="error">{{error}}</p>
      <p class="status ok" id="reg-success" role="status" ng-if="created">Account created for {{created}}.</p>
    </form>
  </main>
  <footer>Fieldstone HR is a synthetic site for the Kaizen engine bench.</footer>
  <script>
    angular.module('fieldstone', []).controller('RegisterCtrl', function ($scope) {
      $scope.emp = { role: 'Engineer' };
      $scope.submit = function () {
        $scope.error = null; $scope.created = null;
        if (!$scope.emp.name || !$scope.emp.email) { $scope.error = 'Name and work email are required.'; return; }
        if (!$scope.emp.terms) { $scope.error = 'The handbook confirmation is required.'; return; }
        $scope.created = $scope.emp.name;
      };
    });
  </script>
</body>
</html>
