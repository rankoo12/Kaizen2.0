<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Lumen Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="brand" id="brand">Lumen Notes</span>
    <nav aria-label="Main">
      <a href="index.html" id="nav-home">Home</a>
      <a href="pricing.html" id="nav-pricing">Pricing</a>
      <a href="contact.html" id="nav-contact">Contact</a>
      <a href="login.html" id="nav-login">Login</a>
    </nav>
  </header>
  <main>
    <h1 id="signin-heading">Sign in to Lumen Notes</h1>

    <!-- v2 mutation: cosmetic-churn. Every id and the button class are renamed
         (a frontend refactor), but every VISIBLE label, placeholder and outcome
         text is byte-identical to v1 — the user-facing feature did not change,
         so a correct engine heals onto the same controls. -->
    <form id="form-signin" novalidate>
      <label for="input-user">Username</label>
      <input type="text" id="input-user" name="username" placeholder="Username">

      <label for="input-pass">Password</label>
      <input type="password" id="input-pass" name="password" placeholder="Password">

      <button class="button-primary" id="btn-signin" type="submit">Sign in</button>
      <p class="status" id="signin-status" role="status"></p>
      <p class="hint" id="signin-hint">Demo account: username <strong>demo</strong>, password <strong>demo123</strong>.</p>
    </form>
  </main>
  <footer id="footer">Lumen Notes is a synthetic site for the Kaizen engine bench.</footer>
  <script src="app.js"></script>
</body>
</html>
