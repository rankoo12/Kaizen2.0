<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Lumen Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="brand" id="brand">Lumen Notes</span>
    <nav aria-label="Main">
      <a href="index.html" id="nav-home">Home</a>
      <a href="pricing.html" id="nav-pricing">Pricing</a>
      <a href="contact.html" id="nav-contact">Contact</a>
      <a href="login.html" id="nav-login">Login</a>
    </nav>
  </header>
  <main>
    <h1 id="contact-title">Contact us</h1>
    <p class="lede">Questions, feedback, or a plan that doesn't fit? Write to us.</p>

    <form id="contact-form" novalidate>
      <label for="contact-name">Full name</label>
      <input type="text" id="contact-name" name="name" placeholder="Ada Lovelace">

      <label for="contact-email">Email address</label>
      <input type="email" id="contact-email" name="email" placeholder="ada@example.com">

      <label for="contact-topic">Topic</label>
      <select id="contact-topic" name="topic">
        <option>Support</option>
        <option>Sales</option>
        <option>Feedback</option>
      </select>

      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" placeholder="How can we help?"></textarea>

      <button class="btn" id="contact-send" type="submit">Send message</button>
      <p class="status" id="contact-status" role="status"></p>
    </form>
  </main>
  <footer id="footer">Lumen Notes is a synthetic site for the Kaizen engine bench.</footer>
  <script src="app.js"></script>
</body>
</html>
