# Changing-sites bench — one server, one docroot per hostname alias.
# Spec: docs/specs/bench/spec-changing-sites.md
#
# Every directive here that disables caching is load-bearing: the harness swaps
# a site's live/ docroot between suite runs and the VERY NEXT request must serve
# the mutated file. etag/if_modified_since off kill conditional-request 304s,
# sendfile/open_file_cache off stop nginx serving stale bytes from fd caches
# over the Docker bind mount, and Cache-Control: no-store stops the browser
# keeping its own copy across the mutation boundary.

map $host $site_root {
    default       /usr/share/nginx/sites/vanilla/live;
    site-vanilla  /usr/share/nginx/sites/vanilla/live;
    site-react    /usr/share/nginx/sites/react-spa/live;
    site-angular  /usr/share/nginx/sites/angular-forms/live;
    site-vue      /usr/share/nginx/sites/vue-cart/live;
    site-jquery   /usr/share/nginx/sites/jquery-classic/live;
    site-stress   /usr/share/nginx/sites/stress/live;
    site-social   /usr/share/nginx/sites/social/live;
}

server {
    listen 80;
    server_name _;
    root $site_root;
    index index.html;

    sendfile off;
    etag off;
    if_modified_since off;
    open_file_cache off;
    add_header Cache-Control "no-store" always;

    # Inline and permissive — immune to a version dir forgetting the file.
    # (The crawler respects a fetched Disallow; an accidental 404 here would
    # fail open anyway, but serving it explicitly removes the ambiguity.)
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # NO SPA fallback on purpose: a fallback-to-index would answer 200 for a
    # REMOVED page and false-pass the must-fail mutations. SPA sites in the
    # fleet use hash routing precisely so they never need one.
    location / {
        try_files $uri $uri/ =404;
    }
}
